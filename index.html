<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>International Sales Dashboard</title>
    
    <!-- Chart.js & Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Simple CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Simple Top Header -->
        <header class="main-header">
            <h1>International Sales Dashboard</h1>
            <div class="date-container">
                <label for="reportDate">Select Date:</label>
                <input type="date" id="reportDate" value="2026-05-20">
            </div>
        </header>

        <!-- KPI Cards Grid -->
        <section class="cards-grid">
            <div class="card">
                <h3>Total Sales</h3>
                <p id="kpiTodaySales">0</p>
            </div>
            <div class="card">
                <h3>Revenue</h3>
                <p id="kpiTodayRevenue">₹0</p>
            </div>
            <div class="card">
                <h3>Orders</h3>
                <p id="kpiMonthlyOrders">0</p>
            </div>
            <div class="card">
                <h3>Top Employee</h3>
                <p id="kpiTopEmployee">-</p>
            </div>
        </section>

        <!-- Charts Grid 1 -->
        <section class="charts-row">
            <div class="chart-box">
                <h2>Monthly Sales Volume</h2>
                <span class="sub-label">from monthly_sales</span>
                <div class="chart-container">
                    <canvas id="monthlySalesChart"></canvas>
                </div>
            </div>

            <div class="chart-box">
                <h2>Daily Sales Trend</h2>
                <span class="sub-label">from daily_sales</span>
                <div class="chart-container">
                    <canvas id="dailySalesChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Chart Grid 2 -->
        <section class="charts-row single-chart">
            <div class="chart-box">
                <h2>Employee Revenue Distribution</h2>
                <div class="chart-container">
                    <canvas id="employeeRevenueChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Sales Leaderboard Table -->
        <section class="table-box">
            <h2>Sales Leaderboard</h2>
            <table class="simple-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Employee</th>
                        <th>Today Sales</th>
                        <th>Today Revenue</th>
                        <th>Monthly Sales</th>
                        <th>Monthly Revenue</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
